<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep Purple Ink Card Surface -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221938"/>
      <stop offset="45%" stop-color="#161124"/>
      <stop offset="100%" stop-color="#0E0A17"/>
    </linearGradient>

    <!-- Official SoWeBuild Violet Gradient -->
    <linearGradient id="brandViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE"/>
      <stop offset="30%" stop-color="#A855F7"/>
      <stop offset="70%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- Subtle Hairline Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Card Frame (Organic Rounded Corners, Zero Boxy Clipping) -->
  <rect x="18" y="18" width="564" height="714" rx="28" fill="url(#cardBg)"/>
  
  <!-- Grid Texture -->
  <rect x="18" y="18" width="564" height="714" rx="28" fill="url(#grid)"/>

  <!-- Subtle Soft Violet Hairline Border -->
  <rect x="18" y="18" width="564" height="714" rx="28" fill="none" stroke="#7C3AED" stroke-opacity="0.25" stroke-width="1.2"/>

  <!-- Inner Soft Inset Frame -->
  <rect x="30" y="30" width="540" height="690" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Top Brand Header Bar -->
  <g transform="translate(50, 56)">
    <!-- Official 56° Slash Glyph -->
    <svg x="0" y="0" width="28" height="42" viewBox="0 0 40 60" fill="none">
      <polygon points="26,2 38,2 14,58 2,58" fill="url(#brandViolet)"/>
    </svg>
    <text x="40" y="20" fill="#FAF8F5" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="19" letter-spacing="3">SOWEBUILD</text>
    <text x="40" y="38" fill="#C084FC" font-family="'Geist Mono', monospace" font-weight="700" font-size="13" letter-spacing="2">DIGITAL PRESS · VOL. 01</text>
  </g>

  <!-- Top Right Edition Pill Tag -->
  <g transform="translate(412, 58)">
    <rect x="0" y="0" width="138" height="34" rx="17" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.45"/>
    <circle cx="18" cy="17" r="5" fill="#10B981"/>
    <text x="32" y="22" fill="#FAF8F5" font-family="'Geist Mono', monospace" font-size="13" font-weight="800" letter-spacing="1.5">EDITION 2026</text>
  </g>

  <!-- Center Watermark -->
  <g transform="translate(240, 200)" opacity="0.06">
    <svg width="220" height="330" viewBox="0 0 40 60" fill="none">
      <polygon points="26,2 38,2 14,58 2,58" fill="#FFFFFF"/>
    </svg>
  </g>

  <!-- Main Typography Block -->
  <g transform="translate(50, 175)">
    <text x="0" y="0" fill="#A855F7" font-family="'Geist Mono', monospace" font-size="14" font-weight="800" letter-spacing="3">TACTICAL CAREER PLAYBOOK</text>
    
    <!-- Huge Headline -->
    <text x="0" y="55" fill="#FAF8F5" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="48" letter-spacing="-1">THE JOB</text>
    <text x="0" y="108" fill="#FAF8F5" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="48" letter-spacing="-1">SEARCH BOOK</text>

    <!-- Subtitle -->
    <text x="0" y="152" fill="#D8B4FE" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" letter-spacing="0.2">The Practical Playbook for Getting a Tech Job.</text>

    <!-- Divider -->
    <line x1="0" y1="178" x2="500" y2="178" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>

  <!-- 2 Large, High-Contrast Highlight Boxes -->
  <g transform="translate(50, 395)">
    <!-- Box 1: 30 Chapters -->
    <rect x="0" y="0" width="500" height="82" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.2"/>
    <circle cx="34" cy="41" r="16" fill="#7C3AED" fill-opacity="0.25"/>
    <path d="M 28 41 L 32 45 L 40 37" fill="none" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="34" fill="#C084FC" font-family="'Geist Mono', monospace" font-size="13" font-weight="800" letter-spacing="1">30 COMPLETE CHAPTERS</text>
    <text x="64" y="56" fill="#FAF8F5" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">ATS Algorithms · GitHub Audits · Cold DMs · Salary</text>

    <!-- Box 2: Free Bonus Directory -->
    <rect x="0" y="98" width="500" height="82" rx="14" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="34" cy="139" r="16" fill="#10B981" fill-opacity="0.25"/>
    <path d="M 28 139 L 32 143 L 40 135" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="132" fill="#34D399" font-family="'Geist Mono', monospace" font-size="13" font-weight="800" letter-spacing="1">FREE BONUS INCLUDED (₹499 VALUE)</text>
    <text x="64" y="154" fill="#FAF8F5" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">144 Companies That Hire Without Whiteboards</text>
  </g>

  <!-- Bottom Access Bar -->
  <g transform="translate(50, 615)">
    <rect x="0" y="0" width="500" height="66" rx="14" fill="#7C3AED" fill-opacity="0.15" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1.2"/>
    <circle cx="32" cy="33" r="14" fill="#7C3AED" fill-opacity="0.3"/>
    <path d="M 33 22 L 27 34 L 32 34 L 31 44 L 37 32 L 32 32 Z" fill="#D8B4FE"/>
    <text x="60" y="29" fill="#FAF8F5" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800">Instant Interactive Web Reader Unlocked</text>
    <text x="60" y="50" fill="#D4D4D8" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">2-DEVICE OFFLINE CACHE · PERPETUAL UPDATES</text>
  </g>
</svg>
